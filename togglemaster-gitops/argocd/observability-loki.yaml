apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    # Mesma onda do Prometheus: o Collector exporta logs para ca.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.6.0

    helm:
      values: |
        # ---------------------------------------------------------
        # Modo de instalacao
        # ---------------------------------------------------------
        # SingleBinary roda ingester, distributor, querier e compactor
        # num processo so. O modo SimpleScalable e o de producao, mas
        # sobe 6+ pods e nao cabe em 2 nos t3.large junto com o resto.
        deploymentMode: SingleBinary

        loki:
          # Sem multi-tenancy. Com auth_enabled true, todo cliente
          # precisa mandar o header X-Scope-OrgID e o Collector falha
          # com 401 sem dizer por que.
          auth_enabled: false

          commonConfig:
            replication_factor: 1

          storage:
            type: filesystem

          # O chart NAO traz schemaConfig por padrao, e sem ele o Loki
          # nem inicia. tsdb + v13 e o esquema atual; versoes antigas
          # (boltdb-shipper, v11) ainda aparecem em tutorial e geram
          # erro de "schema config is not valid".
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          limits_config:
            # O Collector pode reenviar lote com atraso; sem esta folga
            # o Loki rejeita com "entry too far behind".
            reject_old_samples: true
            reject_old_samples_max_age: 168h
            allow_structured_metadata: true
            volume_enabled: true

        singleBinary:
          replicas: 1
          persistence:
            # emptyDir pelo mesmo motivo do Prometheus: sem EBS CSI
            # driver no cluster. Log nao sobrevive a restart do pod.
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi

        # ---------------------------------------------------------
        # Tudo que nao e necessario em instalacao de um pod
        # ---------------------------------------------------------
        # Cada um destes sobe pelo menos um pod a mais. Em
        # SingleBinary eles nao acrescentam nada.
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        gateway:
          # Proxy nginx que roteia entre os componentes. Com um binario
          # unico nao ha o que rotear: Grafana e Collector falam direto
          # com o Service `loki` na porta 3100.
          enabled: false

        lokiCanary:
          enabled: false

        test:
          enabled: false

        # Componentes do modo distribuido, todos zerados.
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m

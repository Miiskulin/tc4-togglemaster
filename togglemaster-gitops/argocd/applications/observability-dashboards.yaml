apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-dashboards
  namespace: argocd
  annotations:
    # Onda 3: o Grafana precisa estar de pe para o sidecar enxergar o
    # ConfigMap e carregar o dashboard.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default

  # Manifestos proprios, sem Helm. Aqui vivem os ConfigMaps de
  # dashboard, alertas e self-healing-webhook.
  source:
    repoURL: https://github.com/Miiskulin/tc4-togglemaster.git
    targetRevision: main
    path: togglemaster-gitops/apps/observability

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

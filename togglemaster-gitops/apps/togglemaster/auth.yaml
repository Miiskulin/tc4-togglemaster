apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 199584041184.dkr.ecr.us-east-1.amazonaws.com/togglemaster-auth:1bc0c7aace40c5e23f54bdb6aa07f027381faed9
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            # ---------------- OpenTelemetry ----------------
            # O Collector roda como DaemonSet: cada pod fala com a
            # instancia do SEU proprio no, sem salto de rede entre nos.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # O Kubernetes substitui $(HOST_IP) porque ele foi
            # declarado acima - a ordem na lista importa.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "auth-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=togglemaster,deployment.environment=production"
            # Logs ficam por conta do receiver filelog do Collector,
            # que ja le o stdout de todos os conteineres. Exportar
            # tambem por OTLP duplicaria cada linha no Loki.
            # Convencao semantica estavel de HTTP. Sem isto, Python
            # emite http.server.duration em milissegundos (convencao
            # antiga) e o otelhttp do Go emite http.server.request.duration
            # em segundos: dois nomes para a mesma coisa, e o painel
            # precisaria de duas consultas.
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: "http"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # ----------------------------------------------
            - name: PORT
              value: "8001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: togglemaster-app-secrets
                  key: AUTH_DATABASE_URL
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: togglemaster-app-secrets
                  key: MASTER_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: togglemaster
spec:
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      serviceAccountName: evaluation-service
      containers:
        - name: evaluation-service
          image: 029709361658.dkr.ecr.us-east-1.amazonaws.com/togglemaster-evaluation:v4
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
          # Dimensionado a partir do pico medido em producao: 11 MiB / 5 mCPU.
          #
          # Sem requests o pod entra na classe BestEffort - sem
          # reserva de CPU e o primeiro a ser despejado quando o no
          # fica sem memoria. Com requests, vira Burstable.
          #
          # Limite de memoria sim, de CPU nao. Estourar memoria mata
          # o processo, e um limite protege os vizinhos. Limite de CPU
          # so causa throttling: a aplicacao fica lenta de um jeito
          # que nao aparece em nenhuma metrica obvia.
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              memory: 128Mi
          env:
            # ---------------- OpenTelemetry ----------------
            # O Collector roda como DaemonSet: cada pod fala com a
            # instancia do SEU proprio no, sem salto de rede entre nos.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # O Kubernetes substitui $(HOST_IP) porque ele foi
            # declarado acima - a ordem na lista importa.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "evaluation-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=togglemaster,deployment.environment=production"
            # Logs ficam por conta do receiver filelog do Collector,
            # que ja le o stdout de todos os conteineres. Exportar
            # tambem por OTLP duplicaria cada linha no Loki.
            # Convencao semantica estavel de HTTP. Sem isto, Python
            # emite http.server.duration em milissegundos (convencao
            # antiga) e o otelhttp do Go emite http.server.request.duration
            # em segundos: dois nomes para a mesma coisa, e o painel
            # precisaria de duas consultas.
            # Habilita /debug/break e /debug/heal. Sem esta
            # variavel as rotas nao sao registradas e respondem
            # 404 - nao ha verificacao em tempo de requisicao
            # que alguem possa contornar.
            #
            # Existe porque o self-healing precisa de uma falha
            # que o rollout restart realmente cure. Parar o banco
            # do flag-service, exemplo do enunciado, nao serve:
            # reiniciar o evaluation nao religa um RDS.
            - name: DEBUG_BREAK_ENABLED
              value: "true"
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: "http"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # ----------------------------------------------
            - name: PORT
              value: "8004"
            - name: REDIS_URL
              value: "redis://togglemaster-redis.v9mrkr.ng.0001.use1.cache.amazonaws.com:6379"
            - name: FLAG_SERVICE_URL
              value: "http://flag-service:8002"
            - name: TARGETING_SERVICE_URL
              value: "http://targeting-service:8003"
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evaluation-service-secret
                  key: SERVICE_API_KEY
            - name: AWS_SQS_URL
              value: "https://sqs.us-east-1.amazonaws.com/029709361658/togglemaster-analytics"
            - name: AWS_REGION
              value: "us-east-1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-service
  namespace: togglemaster
spec:
  selector:
    app: evaluation-service
  ports:
    - port: 8004
      targetPort: 8004
  type: ClusterIP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      serviceAccountName: analytics-service
      containers:
        - name: analytics-service
          image: 199584041184.dkr.ecr.us-east-1.amazonaws.com/togglemaster-analytics:c720e0cf6ad6d8efe75366ff5542b390cab0e2a3
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
          env:
            # ---------------- OpenTelemetry ----------------
            # O Collector roda como DaemonSet: cada pod fala com a
            # instancia do SEU proprio no, sem salto de rede entre nos.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # O Kubernetes substitui $(HOST_IP) porque ele foi
            # declarado acima - a ordem na lista importa.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "analytics-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=togglemaster,deployment.environment=production"
            # Logs ficam por conta do receiver filelog do Collector,
            # que ja le o stdout de todos os conteineres. Exportar
            # tambem por OTLP duplicaria cada linha no Loki.
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # ----------------------------------------------
            - name: PORT
              value: "8005"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_SQS_URL
              value: "https://sqs.us-east-1.amazonaws.com/199584041184/togglemaster-analytics"
            - name: AWS_DYNAMODB_TABLE
              value: "ToggleMasterAnalytics"
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: togglemaster
spec:
  selector:
    app: analytics-service
  ports:
    - port: 8005
      targetPort: 8005
  type: ClusterIP

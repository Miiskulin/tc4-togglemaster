apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          image: 199584041184.dkr.ecr.us-east-1.amazonaws.com/togglemaster-flag:b122aeb946723f4d2912741703da984ca6157711
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          env:
            # ---------------- OpenTelemetry ----------------
            # O Collector roda como DaemonSet: cada pod fala com a
            # instancia do SEU proprio no, sem salto de rede entre nos.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # O Kubernetes substitui $(HOST_IP) porque ele foi
            # declarado acima - a ordem na lista importa.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "flag-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=togglemaster,deployment.environment=production"
            # Logs ficam por conta do receiver filelog do Collector,
            # que ja le o stdout de todos os conteineres. Exportar
            # tambem por OTLP duplicaria cada linha no Loki.
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # ----------------------------------------------
            - name: PORT
              value: "8002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: togglemaster-app-secrets
                  key: FLAG_DATABASE_URL
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8001"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: togglemaster
spec:
  selector:
    app: flag-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP

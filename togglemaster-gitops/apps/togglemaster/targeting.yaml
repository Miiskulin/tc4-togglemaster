apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
        - name: targeting-service
          image: 199584041184.dkr.ecr.us-east-1.amazonaws.com/togglemaster-targeting:c720e0cf6ad6d8efe75366ff5542b390cab0e2a3
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          env:
            # ---------------- OpenTelemetry ----------------
            # O Collector roda como DaemonSet: cada pod fala com a
            # instancia do SEU proprio no, sem salto de rede entre nos.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # O Kubernetes substitui $(HOST_IP) porque ele foi
            # declarado acima - a ordem na lista importa.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "targeting-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=togglemaster,deployment.environment=production"
            # Logs ficam por conta do receiver filelog do Collector,
            # que ja le o stdout de todos os conteineres. Exportar
            # tambem por OTLP duplicaria cada linha no Loki.
            # Convencao semantica estavel de HTTP. Sem isto, Python
            # emite http.server.duration em milissegundos (convencao
            # antiga) e o otelhttp do Go emite http.server.request.duration
            # em segundos: dois nomes para a mesma coisa, e o painel
            # precisaria de duas consultas.
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: "http"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # ----------------------------------------------
            - name: PORT
              value: "8003"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: togglemaster-app-secrets
                  key: TARGETING_DATABASE_URL
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8001"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: togglemaster
spec:
  selector:
    app: targeting-service
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-togglemaster
  namespace: observability
  labels:
    # O sidecar do Grafana varre ConfigMaps com este label e carrega o
    # JSON como dashboard. E assim que o dashboard fica versionado no
    # Git em vez de ser desenhado na interface e existir so no banco
    # do Grafana - se o pod cair com emptyDir, um dashboard clicado
    # some, este aqui volta sozinho.
    grafana_dashboard: "1"
data:
  togglemaster.json: |
    {
      "uid": "togglemaster-visao-geral",
      "title": "ToggleMaster - Visao Geral",
      "tags": ["togglemaster", "fase4"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "servico",
            "label": "Servico",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(http_server_request_duration_seconds_count{k8s_namespace_name=\"togglemaster\"}, service_name)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Saude do ecossistema",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "type": "stat",
          "title": "Requisicoes por segundo",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "decimals": 2, "color": { "mode": "fixed", "fixedColor": "blue" } }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name=\"togglemaster\"}[5m]))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Taxa de erro 5xx",
          "description": "Proporcao de respostas 5xx sobre o total. E a mesma expressao que alimenta o alerta.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.01 },
                  { "color": "red", "value": 0.05 }
                ]
              },
              "color": { "mode": "thresholds" }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name=\"togglemaster\",http_response_status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name=\"togglemaster\"}[5m])), 0.001)"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Latencia p95",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3 } },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{k8s_namespace_name=\"togglemaster\"}[5m])))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Spans enviados ao APM",
          "description": "Contador do proprio Collector. Se zerar enquanto ha trafego, a telemetria parou de sair.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 1 } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(otelcol_exporter_sent_spans{exporter=\"otlp_http/newrelic\"}[5m]))"
            }
          ]
        },
        {
          "type": "row",
          "title": "Taxa de requisicoes dos microsservicos",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 }
        },
        {
          "type": "timeseries",
          "title": "Requisicoes por segundo, por servico",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{service_name}}",
              "expr": "sum by (service_name) (rate(http_server_request_duration_seconds_count{k8s_namespace_name=\"togglemaster\",service_name=~\"$servico\"}[5m]))"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Erros 5xx por segundo, por servico",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["max"] } },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{service_name}}",
              "expr": "sum by (service_name) (rate(http_server_request_duration_seconds_count{k8s_namespace_name=\"togglemaster\",service_name=~\"$servico\",http_response_status_code=~\"5..\"}[5m]))"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latencia p95 por servico",
          "description": "Percentil, nao media. Media esconde a cauda: se 1 em 20 requisicoes leva 3s, a media mal se move e o p95 denuncia.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{service_name}}",
              "expr": "histogram_quantile(0.95, sum by (service_name, le) (rate(http_server_request_duration_seconds_bucket{k8s_namespace_name=\"togglemaster\",service_name=~\"$servico\"}[5m])))"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requisicoes por rota",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "fillOpacity": 10, "lineWidth": 1, "showPoints": "never", "stacking": { "mode": "normal" } }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{service_name}} {{http_route}}",
              "expr": "sum by (service_name, http_route) (rate(http_server_request_duration_seconds_count{k8s_namespace_name=\"togglemaster\",service_name=~\"$servico\"}[5m]))"
            }
          ]
        },
        {
          "type": "row",
          "title": "Uso de recursos do cluster",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 }
        },
        {
          "type": "timeseries",
          "title": "CPU por pod",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 4,
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{k8s_pod_name}}",
              "expr": "sum by (k8s_pod_name) (k8s_pod_cpu_usage{k8s_namespace_name=\"togglemaster\"})"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memoria por pod",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 23 },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{k8s_pod_name}}",
              "expr": "sum by (k8s_pod_name) (k8s_pod_memory_working_set_bytes{k8s_namespace_name=\"togglemaster\"})"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU e memoria dos nos",
          "description": "Os dois nos t3.large do cluster. A linha de memoria inclui tudo que roda neles, nao so o ToggleMaster.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 31 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "custom": { "fillOpacity": 5, "lineWidth": 2, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] } },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "CPU {{instance}}",
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"
            },
            {
              "refId": "B",
              "legendFormat": "Memoria {{instance}}",
              "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100"
            }
          ]
        },
        {
          "type": "row",
          "title": "Logs em tempo real",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 39 }
        },
        {
          "type": "logs",
          "title": "Logs dos microsservicos (Loki)",
          "description": "Todos os conteineres do namespace. O Collector coleta via receiver filelog, sem a aplicacao precisar enviar nada.",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 40 },
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{k8s_namespace_name=\"togglemaster\"}",
              "queryType": "range"
            }
          ]
        }
      ]
    }

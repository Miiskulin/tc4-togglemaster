apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-contact-points
  namespace: observability
  labels:
    grafana_alert: "1"
data:
  contact-points.yaml: |
    apiVersion: 1

    contactPoints:
      # ---------------------------------------------------------
      # Gerenciamento de incidentes
      # ---------------------------------------------------------
      - orgId: 1
        name: pagerduty
        receivers:
          - uid: pagerduty-togglemaster
            type: pagerduty
            settings:
              # Events API v2. A chave vem da variavel de ambiente
              # injetada pelo Secret grafana-alerting-secrets.
              integrationKey: $PAGERDUTY_INTEGRATION_KEY
              severity: critical
              class: disponibilidade
              component: evaluation-service
              group: togglemaster
              summary: '{{ template "default.title" . }}'
            disableResolveMessage: false

      # ---------------------------------------------------------
      # ChatOps
      # ---------------------------------------------------------
      - orgId: 1
        name: discord
        receivers:
          - uid: discord-togglemaster
            type: discord
            settings:
              url: $DISCORD_WEBHOOK_URL
              title: '{{ template "default.title" . }}'
              message: |
                {{ template "default.message" . }}

                Runbook: reiniciar o deployment restaura o servico.
                A automacao de self-healing ja foi acionada em paralelo.
            disableResolveMessage: false

      # ---------------------------------------------------------
      # Self-healing (In-Cluster K8s RBAC + GitHub Actions)
      # ---------------------------------------------------------
      - orgId: 1
        name: self-healing
        receivers:
          # Receiver in-cluster: executa imediatamente o rollout restart
          # no deployment via RBAC nativo do Kubernetes (funcionando
          # tambem no AWS Academy Learner Lab sem depender de OIDC/IAM),
          # e dispara em seguida o repository_dispatch do GitHub Actions
          # quando GITHUB_DISPATCH_TOKEN estiver configurado.
          - uid: incluster-self-healing
            type: webhook
            settings:
              url: http://self-healing-webhook.observability.svc.cluster.local:8080/webhook
              httpMethod: POST
            disableResolveMessage: true

          # Receiver direto para a API de repository_dispatch do GitHub.
          - uid: github-self-healing
            type: webhook
            settings:
              url: https://api.github.com/repos/Miiskulin/tc4-togglemaster/dispatches
              httpMethod: POST
              authorization_scheme: Bearer
              authorization_credentials: $GITHUB_DISPATCH_TOKEN
              payload:
                template: |
                  {
                    "event_type": "self-heal",
                    "client_payload": {
                      "service": "evaluation-service",
                      "namespace": "togglemaster",
                      "alert": "{{ .Alerts.Firing | len }} alerta(s) disparando",
                      "origem": "grafana"
                    }
                  }
            # Nao notificar na resolucao: o self-healing so precisa ser
            # acionado quando o problema comeca. Um disparo no
            # "resolved" reiniciaria o servico que acabou de se
            # recuperar.
            disableResolveMessage: true
